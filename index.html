<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stories by Ariel — people-focused photography for headshots, portraits, and events."
    />
    <title>Stories by Ariel | Photography Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top navigation -->
    <header class="site-header">
      <nav class="nav-wrap">
        <a class="nav-link" href="#" data-home>Home</a>
        <a class="nav-link" href="#" data-contact>Contact</a>
      </nav>
    </header>

    <!-- Home: category grid -->
    <main id="home-view">
      <div class="hero-title">
        <h1 class="site-name">Stories by Ariel</h1>
        <p class="subtitle">Hover and click to explore each collection.</p>
        <div class="scroll-arrow">&#8964;</div>
      </div>
      <div class="category-grid" id="category-grid">
        <!-- JS populates -->
      </div>
    </main>

    <!-- Gallery: photos in a category (layout varies by type) -->
    <section id="gallery-view" class="hidden">
      <div class="gallery-header">
        <button class="back-btn" id="back-btn">&larr; Back</button>
        <h2 class="gallery-title" id="gallery-title"></h2>
      </div>
      <div class="gallery-body" id="gallery-body">
        <!-- JS populates based on layout type -->
      </div>
    </section>

    <!-- Contact page -->
    <section id="contact-view" class="hidden">
      <div class="contact-page">
        <h2 class="contact-heading">Get in Touch</h2>
        <p class="contact-subtext">Interested in working together? Reach out through any of the channels below.</p>
        <div class="contact-links">
          <a class="contact-card" href="https://instagram.com/storiesbyariel" target="_blank" rel="noopener noreferrer">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
            <span class="contact-label">Instagram</span>
            <span class="contact-handle">@storiesbyariel</span>
          </a>
          <a class="contact-card" href="https://wa.me/15513969976" target="_blank" rel="noopener noreferrer">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="contact-label">WhatsApp</span>
            <span class="contact-handle">(551) 396-9976</span>
          </a>
        </div>
      </div>
    </section>

    <!-- Lightbox: fullscreen single image -->
    <div id="lightbox" class="lightbox hidden">
      <button class="lb-close" id="lb-close">&times;</button>
      <button class="lb-prev" id="lb-prev">&#10094;</button>
      <button class="lb-next" id="lb-next">&#10095;</button>
      <img id="lb-img" class="lb-img" src="" alt="" />
      <div class="lb-info">
        <div class="lb-counter" id="lb-counter"></div>
        <div class="lb-meta" id="lb-meta"></div>
      </div>
    </div>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Stories by Ariel. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
